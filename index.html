<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly hours</title>
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6; --card:#FFFFFF; --ink:#111C2A; --mute:#64748B; --line:#DDE4EC; --track:#E6EBF2;
    --on:#FFFFFF; --done:#0E9F5B; --danger:#C9302C;
    --c0:#2B59FF; --c1:#0B9C8F; --c2:#7B4DFF; --c3:#C96F00; --c4:#E0366B; --c5:#1B8FD6;
    --shadow:0 1px 2px rgba(17,28,42,.05),0 10px 26px -14px rgba(17,28,42,.22);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C1118; --card:#151D28; --ink:#EAF0F6; --mute:#8B9BAD; --line:#243040; --track:#223041;
      --on:#0C1118; --done:#3CCB86; --danger:#FF7A75;
      --c0:#7C97FF; --c1:#3CCFC0; --c2:#A98BFF; --c3:#FFB43A; --c4:#FF7FA5; --c5:#5CBBF7;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C1118; --card:#151D28; --ink:#EAF0F6; --mute:#8B9BAD; --line:#243040; --track:#223041;
    --on:#0C1118; --done:#3CCB86; --danger:#FF7A75;
    --c0:#7C97FF; --c1:#3CCFC0; --c2:#A98BFF; --c3:#FFB43A; --c4:#FF7FA5; --c5:#5CBBF7;
    --shadow:none;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 16px/1.4 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  main{max-width:520px;margin:0 auto;padding:22px 16px 120px}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--c0);outline-offset:2px}

  /* header */
  .head{margin-bottom:22px}
  .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .head h1{margin:0;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.03em}
  .today{margin:6px 0 0;font-size:15px;font-weight:600;color:var(--mute)}
  .today:empty{display:none}
  .sum{text-align:right;line-height:1.1}
  .sum b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .sum small{font-size:13px;color:var(--mute)}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
  .pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
  .pill .rng{padding:0 6px;font-size:15px;font-weight:600;min-width:150px;text-align:center}
  .nav{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
  .nav:disabled{opacity:.3;cursor:default}
  .nav svg{width:18px;height:18px}

  /* cards */
  .card{
    --pc:var(--c0); --seg:var(--card);
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:14px 16px 13px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .card.run{
    border-color:var(--pc);
    background:color-mix(in srgb, var(--pc) 7%, var(--card));
    --seg:color-mix(in srgb, var(--pc) 7%, var(--card));
  }
  .top{display:flex;align-items:center;gap:8px}
  .chip{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
  .top h2{flex:1;min-width:0;margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ico{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;flex:none}
  .ico svg{width:20px;height:20px}
  .play{width:48px;height:48px;border-radius:50%;border:0;background:var(--pc);color:var(--on);display:grid;place-items:center;flex:none;transition:box-shadow .2s ease}
  .play svg{width:20px;height:20px}
  .card.run .play{background:var(--ink);color:var(--bg);box-shadow:0 0 0 5px color-mix(in srgb, var(--pc) 24%, transparent)}

  .nums{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
  .tot{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .goal{color:var(--mute);font-size:15px}
  .status{margin-left:auto;font-size:14px;font-weight:600;color:var(--mute);text-align:right}
  .card.done .status{color:var(--done)}

  .bar{position:relative;height:14px;border-radius:7px;background:var(--track);overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--pc);border-radius:7px;transition:width .3s ease}
  .ticks{
    position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(to right,transparent calc(100% - 2px),var(--seg) calc(100% - 2px));
    background-size:calc(100% * var(--step) / var(--goal)) 100%;
  }

  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:9px;font-size:13px;color:var(--mute);min-height:18px}
  .sess{display:none;align-items:center;gap:6px;color:var(--ink);font-weight:600}
  .card.run .sess{display:inline-flex}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--pc);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}

  .empty{padding:36px 12px 16px;text-align:center;color:var(--mute)}
  .empty strong{display:block;color:var(--ink);font-size:22px;letter-spacing:-.01em;margin:22px 0 6px}
  .empty .bar{max-width:220px;margin:0 auto;height:26px;border-radius:13px;--seg:var(--bg)}
  .empty .fill{background:var(--c0);border-radius:13px}

  /* add button */
  .dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
    padding:28px 16px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,var(--bg) 55%,transparent)}
  .add{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 24px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
  .add svg{width:18px;height:18px}

  /* dialog */
  dialog{border:0;padding:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(420px,calc(100% - 32px))}
  dialog::backdrop{background:rgba(8,14,20,.55)}
  .sheet{padding:22px}
  .sheet h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .sheet label{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
  .sheet input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
  .sw{display:flex;gap:10px;flex-wrap:wrap}
  .sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:var(--sc);box-shadow:0 0 0 1px var(--line)}
  .sw button[aria-pressed="true"]{border-color:var(--card);box-shadow:0 0 0 3px var(--ink)}
  .adj{display:flex;gap:8px}
  .adj .seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
  .adj .seg button{height:50px;padding:0 14px;border:0;background:transparent;color:var(--mute);font-weight:600}
  .adj .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .err{min-height:20px;margin:10px 0 0;font-size:14px;color:var(--danger)}
  .actions{display:flex;align-items:center;gap:8px;margin-top:6px}
  .actions .sp{flex:1}
  .btn{height:50px;padding:0 20px;border-radius:14px;border:0;font-weight:600}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.danger{color:var(--danger)}

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
    .fill,.play{transition:none}
    button:active{transform:none}
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <div class="row1">
      <div><h1 id="wkTitle">This week</h1><p class="today" id="today"></p></div>
      <div class="sum"><b id="grand">0m</b><small>logged</small></div>
    </div>
    <div class="row2">
    <div class="pill">
      <button class="nav" id="prev" aria-label="Previous week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="rng" id="wkRange"></span>
      <button class="nav" id="next" aria-label="Next week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <button class="ico" id="setBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    </div>
  </header>

  <section id="list"></section>
</main>

<div class="dock">
  <button class="add" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add project
  </button>
</div>

<dialog id="sdlg">
  <div class="sheet">
    <h2>Settings</h2>
    <label>Week starts on</label>
    <div class="adj">
      <div class="seg" role="group" aria-label="First day of the week">
        <button type="button" id="wSun" aria-pressed="true">Sunday</button>
        <button type="button" id="wMon" aria-pressed="false">Monday</button>
      </div>
    </div>
    <div class="actions">
      <span class="sp"></span>
      <button type="button" class="btn primary" id="sClose">Done</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <div class="sheet">
    <h2 id="dTitle">New project</h2>
    <label for="dName">Name</label>
    <input id="dName" maxlength="40" autocomplete="off">
    <label for="dGoal">Weekly goal in hours</label>
    <input id="dGoal" type="number" inputmode="decimal" min="0.5" max="168" step="0.5">
    <label>Color</label>
    <div class="sw" id="dColors"></div>
    <div id="dAdjust" hidden>
      <label for="dMin">Fix logged time (minutes)</label>
      <div class="adj">
        <div class="seg" role="group" aria-label="Add or remove">
          <button type="button" id="sAdd" aria-pressed="true">Add</button>
          <button type="button" id="sRem" aria-pressed="false">Remove</button>
        </div>
        <input id="dMin" type="number" inputmode="numeric" min="0" step="5" placeholder="30">
      </div>
    </div>
    <p class="err" id="dErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost danger" id="dDelete" hidden>Delete</button>
      <span class="sp"></span>
      <button type="button" class="btn ghost" id="dCancel">Cancel</button>
      <button type="button" class="btn primary" id="dSave">Save</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  var KEY = 'weekly-hours-v1';
  var NCOLORS = 6;
  var S = { projects: [], entries: [], running: null, settings: { weekStart: 0 } };
  var weekOffset = 0;

  var $ = function(id){ return document.getElementById(id); };
  var list = $('list'), dlg = $('dlg');

  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>';

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function norm(d){
    d = d || {};
    var projects = Array.isArray(d.projects) ? d.projects.filter(function(p){ return p && p.id; }) : [];
    projects.forEach(function(p, i){
      if (typeof p.color !== 'number' || p.color < 0 || p.color >= NCOLORS) p.color = i % NCOLORS;
    });
    return {
      projects: projects,
      entries: Array.isArray(d.entries) ? d.entries : [],
      running: d.running && d.running.p ? { p: d.running.p, s: d.running.s } : null,
      settings: { weekStart: d.settings && d.settings.weekStart === 1 ? 1 : 0 }
    };
  }

  /* ---------- time helpers (first day of the week is a setting: 0 = Sunday, 1 = Monday) ---------- */
  function weekStartOf(ts){
    var d = new Date(ts);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() - S.settings.weekStart + 7) % 7));
    return d.getTime();
  }
  function weekStart(offset){
    var d = new Date(weekStartOf(Date.now()));
    d.setDate(d.getDate() + offset * 7);
    return d.getTime();
  }
  function weekEnd(ws){
    var d = new Date(ws);
    d.setDate(d.getDate() + 7);
    return d.getTime();
  }
  function fmtHM(mins){
    mins = Math.max(0, Math.floor(mins));
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h === 0) return m + 'm';
    return m === 0 ? h + 'h' : h + 'h ' + m + 'm';
  }
  function fmtClock(ms){
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h + ':' + String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }
  function totalMs(pid, ws, we, now){
    var t = 0;
    S.entries.forEach(function(e){
      if (e.p !== pid) return;
      if (e.m){
        if (e.s >= ws && e.s < we) t += e.d;
      } else {
        var a = Math.max(e.s, ws), b = Math.min(e.s + e.d, we);
        if (b > a) t += b - a;
      }
    });
    if (S.running && S.running.p === pid){
      var a2 = Math.max(S.running.s, ws), b2 = Math.min(now, we);
      if (b2 > a2) t += b2 - a2;
    }
    return Math.max(0, t);
  }
  // Average per week over finished weeks, from the week of the first logged time.
  // Weeks with no work between then and now count as zero. The current week is excluded.
  function avgMs(pid, now){
    var first = null;
    S.entries.forEach(function(e){
      if (e.p === pid && (first === null || e.s < first)) first = e.s;
    });
    if (S.running && S.running.p === pid && (first === null || S.running.s < first)) first = S.running.s;
    if (first === null) return null;
    var cur = weekStart(0), w = weekStartOf(first), n = 0, sum = 0;
    while (w < cur){
      var e2 = weekEnd(w);
      sum += totalMs(pid, w, e2, now);
      n += 1;
      w = e2;
    }
    return n ? sum / n : null;
  }

  /* ---------- persistence ---------- */
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  function commit(){
    save();
    render();
  }

  /* ---------- actions ---------- */
  function stopRunning(now){
    var r = S.running;
    if (!r) return;
    var d = now - r.s;
    if (d >= 1000) S.entries.push({ p: r.p, s: r.s, d: d });
    S.running = null;
  }
  function toggle(pid){
    var now = Date.now();
    var same = S.running && S.running.p === pid;
    stopRunning(now);
    if (!same) S.running = { p: pid, s: now };
    commit();
  }

  /* ---------- render ---------- */
  function rangeLabel(ws, we){
    var opt = { day: 'numeric', month: 'short' };
    var a = new Date(ws), b = new Date(we - 864e5);
    return a.toLocaleDateString(undefined, opt) + ' – ' + b.toLocaleDateString(undefined, opt);
  }
  function render(){
    var ws = weekStart(weekOffset), we = weekEnd(ws);
    var cur = weekOffset === 0;
    var now = Date.now();
    $('wkTitle').textContent = cur ? 'This week' : (weekOffset === -1 ? 'Last week' : 'Week of ' + new Date(ws).toLocaleDateString(undefined,{day:'numeric',month:'short'}));
    $('wkRange').textContent = rangeLabel(ws, we);
    $('next').disabled = weekOffset >= 0;

    if (!S.projects.length){
      list.innerHTML =
        '<div class="empty">' +
          '<div class="bar" style="--goal:5;--step:1"><i class="fill" style="width:62%"></i><b class="ticks"></b></div>' +
          '<strong>No projects yet</strong>' +
          'Add a project, set its weekly goal, then start the timer while you work.' +
        '</div>';
    } else {
      list.innerHTML = S.projects.map(function(p){
        var gh = p.goalMin / 60;
        var step = gh <= 24 ? 1 : (gh <= 48 ? 2 : 5);
        var running = S.running && S.running.p === p.id;
        var avg = avgMs(p.id, now);
        var avgTxt = avg === null ? 'No weekly average yet' : 'Avg ' + fmtHM(avg / 60000) + ' / week';
        return '' +
        '<article class="card' + (running ? ' run' : '') + '" data-p="' + esc(p.id) + '" style="--pc:var(--c' + p.color + ');--goal:' + gh + ';--step:' + step + '">' +
          '<div class="top">' +
            '<i class="chip"></i>' +
            '<h2>' + esc(p.name) + '</h2>' +
            '<button class="ico" data-edit aria-label="Edit ' + esc(p.name) + '">' + ICON_EDIT + '</button>' +
            (cur ? '<button class="play" data-toggle aria-label="' + (running ? 'Stop timer for ' : 'Start timer for ') + esc(p.name) + '">' + (running ? ICON_STOP : ICON_PLAY) + '</button>' : '') +
          '</div>' +
          '<div class="nums"><span class="tot">0m</span><span class="goal">of ' + fmtHM(p.goalMin) + '</span><span class="status"></span></div>' +
          '<div class="bar"><i class="fill"></i><b class="ticks"></b></div>' +
          '<div class="foot"><span class="avg">' + avgTxt + '</span><span class="sess"><i class="dot"></i><span class="clock">0:00:00</span></span></div>' +
        '</article>';
      }).join('');
    }
    tick();
  }

  function tick(){
    var now = Date.now();
    $('today').textContent = weekOffset === 0 ? new Date(now).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) : '';
    var ws = weekStart(weekOffset), we = weekEnd(ws);
    var grand = 0;
    S.projects.forEach(function(p){
      var ms = totalMs(p.id, ws, we, now);
      grand += ms;
      var el = list.querySelector('[data-p="' + p.id + '"]');
      if (!el) return;
      var mins = Math.floor(ms / 60000);
      var left = p.goalMin - mins;
      el.querySelector('.tot').textContent = fmtHM(mins);
      el.querySelector('.fill').style.width = Math.min(100, ms / (p.goalMin * 60000) * 100) + '%';
      el.classList.toggle('done', left <= 0);
      el.querySelector('.status').textContent = left > 0 ? fmtHM(left) + ' to go' : (left === 0 ? '✓ Goal reached' : '✓ ' + fmtHM(-left) + ' over');
      if (S.running && S.running.p === p.id){
        el.querySelector('.clock').textContent = fmtClock(now - S.running.s);
      }
    });
    $('grand').textContent = fmtHM(Math.floor(grand / 60000));
  }

  /* ---------- dialog ---------- */
  var editing = null, adjSign = 1, delArmed = false, dColor = 0;
  function setSign(s){
    adjSign = s;
    $('sAdd').setAttribute('aria-pressed', s === 1 ? 'true' : 'false');
    $('sRem').setAttribute('aria-pressed', s === -1 ? 'true' : 'false');
  }
  function buildSwatches(){
    var box = $('dColors');
    box.innerHTML = '';
    for (var i = 0; i < NCOLORS; i++){
      (function(i){
        var b = document.createElement('button');
        b.type = 'button';
        b.style.setProperty('--sc', 'var(--c' + i + ')');
        b.setAttribute('aria-label', 'Color ' + (i + 1));
        b.setAttribute('aria-pressed', i === dColor ? 'true' : 'false');
        b.addEventListener('click', function(){ dColor = i; buildSwatches(); });
        box.appendChild(b);
      })(i);
    }
  }
  function openDlg(pid){
    editing = pid || null;
    delArmed = false;
    var p = pid ? S.projects.filter(function(x){ return x.id === pid; })[0] : null;
    dColor = p ? p.color : S.projects.length % NCOLORS;
    $('dTitle').textContent = p ? 'Edit project' : 'New project';
    $('dName').value = p ? p.name : '';
    $('dGoal').value = p ? String(p.goalMin / 60) : '10';
    $('dMin').value = '';
    $('dErr').textContent = '';
    $('dAdjust').hidden = !p;
    $('dDelete').hidden = !p;
    $('dDelete').textContent = 'Delete';
    setSign(1);
    buildSwatches();
    dlg.showModal();
    if (!p) $('dName').focus();
  }
  function saveDlg(){
    var name = $('dName').value.trim();
    var g = parseFloat(String($('dGoal').value).replace(',', '.'));
    if (!name){ $('dErr').textContent = 'Enter a project name.'; return; }
    if (!(g > 0 && g <= 168)){ $('dErr').textContent = 'Set a goal between 0.5 and 168 hours.'; return; }
    var goalMin = Math.round(g * 60);
    var pid = editing;
    if (pid){
      var p = S.projects.filter(function(x){ return x.id === pid; })[0];
      if (p){ p.name = name; p.goalMin = goalMin; p.color = dColor; }
      var m = parseInt($('dMin').value, 10);
      if (m > 0){
        var ws = weekStart(weekOffset);
        S.entries.push({ p: pid, s: weekOffset === 0 ? Date.now() : ws + 12 * 36e5, d: adjSign * m * 60000, m: 1 });
      }
    } else {
      S.projects.push({ id: uid(), name: name, goalMin: goalMin, color: dColor });
    }
    dlg.close();
    commit();
  }
  function deleteProject(){
    if (!delArmed){
      delArmed = true;
      $('dDelete').textContent = 'Tap again to delete';
      return;
    }
    S.projects = S.projects.filter(function(x){ return x.id !== editing; });
    S.entries = S.entries.filter(function(e){ return e.p !== editing; });
    if (S.running && S.running.p === editing) S.running = null;
    dlg.close();
    commit();
  }

  /* ---------- settings ---------- */
  var sdlg = $('sdlg');
  function paintSettings(){
    $('wSun').setAttribute('aria-pressed', S.settings.weekStart === 0 ? 'true' : 'false');
    $('wMon').setAttribute('aria-pressed', S.settings.weekStart === 1 ? 'true' : 'false');
  }
  function setWeekStart(v){
    if (S.settings.weekStart === v) return;
    S.settings.weekStart = v;
    weekOffset = 0;
    paintSettings();
    commit();
  }

  /* ---------- events ---------- */
  $('setBtn').addEventListener('click', function(){ paintSettings(); sdlg.showModal(); });
  $('wSun').addEventListener('click', function(){ setWeekStart(0); });
  $('wMon').addEventListener('click', function(){ setWeekStart(1); });
  $('sClose').addEventListener('click', function(){ sdlg.close(); });
  sdlg.addEventListener('click', function(ev){ if (ev.target === sdlg) sdlg.close(); });
  list.addEventListener('click', function(ev){
    var card = ev.target.closest('[data-p]');
    if (!card) return;
    var pid = card.getAttribute('data-p');
    if (ev.target.closest('[data-toggle]')) toggle(pid);
    else if (ev.target.closest('[data-edit]')) openDlg(pid);
  });
  $('addBtn').addEventListener('click', function(){ openDlg(null); });
  $('prev').addEventListener('click', function(){ weekOffset -= 1; render(); });
  $('next').addEventListener('click', function(){ if (weekOffset < 0){ weekOffset += 1; render(); } });
  $('sAdd').addEventListener('click', function(){ setSign(1); });
  $('sRem').addEventListener('click', function(){ setSign(-1); });
  $('dSave').addEventListener('click', saveDlg);
  $('dCancel').addEventListener('click', function(){ dlg.close(); });
  $('dDelete').addEventListener('click', deleteProject);
  dlg.addEventListener('click', function(ev){ if (ev.target === dlg) dlg.close(); });
  $('dName').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') saveDlg(); });
  document.addEventListener('visibilitychange', tick);
  setInterval(tick, 1000);

  /* ---------- boot ---------- */
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) S = norm(JSON.parse(raw));
  } catch (e) {}
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
